[package]
name = "sovereign-core"
version = "0.1.0"
edition = "2021"
description = "Local intelligence core for the Sovereign Second Brain — JSON-RPC over stdio, zero cloud"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[lib]
name = "sovereign_core"
path = "src/lib.rs"

[[bin]]
name = "sovereign-core"
path = "src/main.rs"
